<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <title>Mirador: stitch two images</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500">
  </head>
  <body>
    <div id="mirador" style="position: absolute; top: 0; bottom: 0; left: 0; right: 0;"></div>
    <script type="module">
      import Mirador from '../src';
      import { LEFT_WINDOW_ID, RIGHT_WINDOW_ID, stitchingPlugins } from './stitching/index.js';

      // Starts on the welcome screen; open two windows with Start here / Add resource.
      // ?left=https://...&right=https://... opens them straight away instead.
      const params = new URLSearchParams(window.location.search);
      const left = params.get('left');
      const right = params.get('right');
      const examples = [
        'https://manifests.collections.yale.edu/ycba/obj/1096',
        'https://manifests.collections.yale.edu/ycba/obj/49305',
        'https://manifests.collections.yale.edu/ycba/alma/22664181270008651',
        'https://manifests.collections.yale.edu/ycba/obj/49291',
      ];

      Mirador.viewer(
        {
          id: 'mirador',
          workspace: { type: 'mosaic' },
          windows: left && right ? [{ id: LEFT_WINDOW_ID, manifestId: left }, { id: RIGHT_WINDOW_ID, manifestId: right }] : [],
          catalog: [...new Set([left, right, ...examples].filter(Boolean))].map((manifestId) => ({ manifestId })),
          translations: { en: { welcome: 'Mirador Layering Tool' } },
        },
        stitchingPlugins,
      );
    </script>
  </body>
</html>
