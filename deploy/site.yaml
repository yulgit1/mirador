AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Mirador demo site: a private S3 bucket served through CloudFront (Origin Access Control).
  One stack per environment (test, prod). Deployed by deploy/deploy.sh.

Parameters:
  Environment:
    Type: String
    AllowedValues: [test, prod]
  DomainName:
    Type: String
    Default: ''
    Description: Optional custom domain (e.g. mirador.example.edu). Leave empty to use the cloudfront.net domain.
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN in us-east-1 for DomainName. Required when DomainName is set.
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
  UploadBucket:
    Type: String
    Default: chit-iiif
    Description: Existing bucket that the stitching page uploads manifests to (it must allow public reads of the prefix).
  UploadPrefix:
    Type: String
    Default: manifests/uploads/

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # old objects are kept for 30 days so a bad deploy can be rolled back
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub mirador-${Environment}-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Same URLs as the dev server and netlify.toml: / -> /demo/index.html, /<page> -> /demo/<page>.html
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub mirador-${Environment}-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Map short demo URLs onto /demo/*.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/') {
            request.uri = '/demo/index.html';
          } else if (/^\/[^/]+$/.test(uri) && (uri.indexOf('.') === -1 || /\.html$/.test(uri))) {
            request.uri = '/demo' + uri + (/\.html$/.test(uri) ? '' : '.html');
          }
          return request;
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub mirador-${Environment}-headers
        # manifests and images load from other origins, so no restrictive CSP here
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true

  # Password for uploading stitched manifests; read it with
  #   aws secretsmanager get-secret-value --secret-id <stack>/upload-password --query SecretString --output text
  UploadPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/upload-password
      Description: Password the stitching page asks for before uploading a manifest to S3
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  UploadFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: upload-manifests
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${UploadBucket}/${UploadPrefix}*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref UploadPassword

  # POST /api/upload-manifest {name, password, manifest, overwrite}: checks the password, then
  # writes the manifest (its id set to its public URL) to s3://UploadBucket/UploadPrefix<name>.
  # Responds 401 for a wrong password (not 403, which the distribution turns into a 404 page)
  # and 409 if the file exists, unless overwrite is true.
  UploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Uploads stitched manifests from demo/stitching.html to S3
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Role: !GetAtt UploadFunctionRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref UploadBucket
          PREFIX: !Ref UploadPrefix
          PUBLIC_BASE: !Sub https://${UploadBucket}.s3.${AWS::Region}.amazonaws.com/${UploadPrefix}
          SECRET_ARN: !Ref UploadPassword
      Code:
        ZipFile: |
          const crypto = require('node:crypto');
          const { PutObjectCommand, S3Client } = require('@aws-sdk/client-s3');
          const { GetSecretValueCommand, SecretsManagerClient } = require('@aws-sdk/client-secrets-manager');

          const s3 = new S3Client({});
          const secrets = new SecretsManagerClient({});
          const { BUCKET, PREFIX, PUBLIC_BASE, SECRET_ARN } = process.env;
          let password;

          const reply = (statusCode, body) => ({
            body: JSON.stringify(body),
            headers: { 'Cache-Control': 'no-store', 'Content-Type': 'application/json' },
            statusCode,
          });
          const digest = (value) => crypto.createHash('sha256').update(String(value)).digest();

          exports.handler = async (event) => {
            if (event.requestContext.http.method !== 'POST') return reply(405, { error: 'Use POST' });

            let request;
            try {
              request = JSON.parse(event.isBase64Encoded ? Buffer.from(event.body, 'base64').toString('utf8') : event.body);
            } catch (e) {
              return reply(400, { error: 'The request must be JSON' });
            }

            password ??= (await secrets.send(new GetSecretValueCommand({ SecretId: SECRET_ARN }))).SecretString;
            if (!crypto.timingSafeEqual(digest(request.password), digest(password))) {
              await new Promise((resolve) => { setTimeout(resolve, 1000); });
              return reply(401, { error: 'Wrong password' });
            }

            const name = String(request.name || '');
            if (!/^[A-Za-z0-9_-][A-Za-z0-9._-]*\.json$/.test(name) || name.length > 200) {
              return reply(400, { error: 'Use a name made of letters, digits, ".", "_" or "-"' });
            }
            if (!request.manifest || typeof request.manifest !== 'object') return reply(400, { error: 'No manifest' });

            const url = PUBLIC_BASE + name;
            const manifest = { ...request.manifest, id: url };
            try {
              await s3.send(new PutObjectCommand({
                Body: `${JSON.stringify(manifest, null, 2)}\n`,
                Bucket: BUCKET,
                CacheControl: 'no-cache',
                ContentType: 'application/json',
                Key: PREFIX + name,
                ...(!request.overwrite && { IfNoneMatch: '*' }),
              }));
            } catch (e) {
              if ([409, 412].includes(e.$metadata?.httpStatusCode)) return reply(409, { error: `${name} already exists` });
              console.error(e);
              return reply(500, { error: 'Uploading failed' });
            }
            return reply(201, { manifest, url });
          };
      Tags:
        - Key: Environment
          Value: !Ref Environment

  UploadFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref UploadFunction
      # the password is checked by the function; CloudFront serves it at /api/upload-manifest
      AuthType: NONE

  UploadFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  UploadFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub Mirador demo site (${Environment})
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: upload
            # FunctionUrl is https://<id>.lambda-url.<region>.on.aws/
            DomainName: !Select [2, !Split ['/', !GetAtt UploadFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        CacheBehaviors:
          - PathPattern: /api/upload-manifest
            TargetOriginId: upload
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            # AWS managed CachingDisabled and AllViewerExceptHostHeader policies
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref SecurityHeaders
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # AWS managed CachingOptimized policy; per-object Cache-Control headers set by deploy.sh still apply
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # S3 answers 403 for missing keys when the bucket is private
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /demo/index.html
            ErrorCachingMinTTL: 60
      Tags:
        - Key: Environment
          Value: !Ref Environment

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub ${SiteBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  UploadPasswordSecret:
    Value: !Ref UploadPassword
  SiteUrl:
    Value: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
