<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <title>Mirador: stitch up to four images</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500">
  </head>
  <body>
    <div id="mirador" style="position: absolute; top: 0; bottom: 0; left: 0; right: 0;"></div>
    <script type="module">
      import Mirador from '../src';
      import { MAX_IMAGES, stitchingPlugins, WINDOW_IDS } from './stitching/index.js';

      // Starts on the welcome screen; open 2-4 windows with Start here / Add resource.
      // ?images=https://...,https://... (up to 4) opens them straight away instead;
      // the older ?left=https://...&right=https://... also works.
      const params = new URLSearchParams(window.location.search);
      const images = (params.get('images')?.split(',') || [params.get('left'), params.get('right')])
        .map((url) => url?.trim())
        .filter(Boolean)
        .slice(0, MAX_IMAGES);
      const examples = [
        'https://manifests.collections.yale.edu/ycba/obj/1096',
        'https://manifests.collections.yale.edu/ycba/obj/49305',
        'https://manifests.collections.yale.edu/ycba/alma/22664181270008651',
        'https://manifests.collections.yale.edu/ycba/obj/49291',
        'https://manifests.collections.yale.edu/ycba/obj/5001',
        'https://manifests.collections.yale.edu/ycba/obj/38526'
      ];

      Mirador.viewer(
        {
          id: 'mirador',
          workspace: { type: 'mosaic' },
          windows: images.length > 1 ? images.map((manifestId, i) => ({ id: WINDOW_IDS[i], manifestId })) : [],
          catalog: [...new Set([...images, ...examples])].map((manifestId) => ({ manifestId })),
          translations: { en: { welcome: 'Mirador Layering Tool' } },
        },
        stitchingPlugins,
      );
    </script>
  </body>
</html>
